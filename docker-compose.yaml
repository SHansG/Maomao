name: Maomao

services:
  mongo:
    image: mongo:8.0-noble

    build:
      context: ./mongo
      dockerfile: dockerfile

    env_file:
      - ./mongo/.env.mongo

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - mongo_data:/data/db

  app:
    image: python:3.13-slim-bookworm
    build:
      context: ./app
      dockerfile: dockerfile
    env_file:
      - ./app/.env.bot
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - app_data:/app/data

volumes:
  mongo_data:
  app_data: